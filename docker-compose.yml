services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-better_screening}
    ports:
      # host-side 5433 to avoid clashing with a locally-installed Postgres on 5432;
      # the container itself still listens on 5432, so DB_HOST=postgres:5432 from
      # inside docker-compose (the `app` service) is unaffected.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO AIStor — needs a license file at $HOME/minio/minio.license.
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: aistor-server
    restart: unless-stopped
    tty: true
    command: minio server /mnt/data --license /minio.license
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ${HOME}/minio/data:/mnt/data
      - ${HOME}/minio/minio.license:/minio.license
      - ${HOME}/minio/certs:/etc/minio/certs
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-minioadmin} ${STORAGE_SECRET_ACCESS_KEY:-minioadmin};
      mc mb -p local/${STORAGE_BUCKET_RESUMES:-bscreen-resumes-dev};
      mc mb -p local/${STORAGE_BUCKET_RECORDINGS:-bscreen-recordings-dev};
      exit 0;
      "

  maildev:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - '1080:1080' # web UI
      - '1025:1025' # smtp

  # LiveKit (candidate interview room video) + Egress (per-question MP4 recording into
  # MinIO). Host networking is the simplest way to get WebRTC/UDP working in local dev
  # (Linux only); both reach Redis and MinIO on localhost through the ports above.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      SMTP_HOST: maildev
      SMTP_PORT: 1025
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']
    command: npm run migration:run

volumes:
  postgres_data:
  redis_data:
